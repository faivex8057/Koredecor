<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KORE DECOR | Site Removed</title>
  <meta name="description" content="This Kore Decor static site content has been removed.">
  <style>
    :root {
      --bg: #17120d;
      --panel: #201a16;
      --line: rgba(255,255,255,0.12);
      --text: #f5efe8;
      --muted: #d7c7b6;
      --accent: #d8b08a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(640px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 42px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.26);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      letter-spacing: 0.2em;
      font-size: 11px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }
    p {
      margin: 0 auto;
      max-width: 35rem;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">KORE DECOR</p>
    <h1>Static site removed</h1>
    <p>This Kore Decor static site has been removed from the repository. If you want, I can help set up a new app, landing page, or full website in its place.</p>
  </main>
</body>
</html>
